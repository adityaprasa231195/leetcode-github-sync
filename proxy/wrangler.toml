name = "leetcode-github-sync-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
# Non-secret vars go here. Secrets are set via `wrangler secret put`.

[[routes]]
# Update this to match your deployed worker URL pattern
pattern = "your-proxy.example.com/api/github-oauth"
zone_name = "example.com"
